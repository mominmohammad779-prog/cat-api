<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat API Project</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #fff7ed;
      color: #333;
      padding: 30px;
    }

    img {
      display: block;
      max-width: 90%;
      max-height: 400px;
      margin: 20px auto;
      border-radius: 12px;
    }

    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      background: #f28c28;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Random Cat Photos 🐱</h1>
  <p>Click the button to meet a different cat.</p>
  <button id="catButton">Show me a cat</button>
  <p id="message">Your cat will appear here.</p>
  <img id="catImage" alt="A random cat">

  <script>
    const button = document.getElementById("catButton");
    const image = document.getElementById("catImage");
    const message = document.getElementById("message");

    button.addEventListener("click", async () => {
      message.textContent = "Loading a cat...";
      image.removeAttribute("src");

      try {
        const response = await fetch(
          "https://api.thecatapi.com/v1/images/search?limit=1",
          { headers: { "x-api-key": "DEMO-API-KEY" } }
        );

        if (!response.ok) throw new Error("Could not load a cat.");

        const cats = await response.json();
        image.src = cats[0].url;
        message.textContent = "Here’s your cat!";
      } catch (error) {
        message.textContent = "Sorry, the cat could not load. Please try again.";
      }
    });
  </script>
</body>
</html>
